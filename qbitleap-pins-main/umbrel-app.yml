  "releaseNotes": "Run the PINS inscriber from the Umbrel terminal.",
  "developer": "QBitLeap",
  "website": "https://github.com/P2MR-PINS-Protocol/pins",
  "dependencies": [
    "qbitleap-core-main"
  ],
  "repo": "https://github.com/QBitLeap/pins-umbrel",
  "support": "https://github.com/QBitLeap/pins-umbrel/issues",
  "port": 5102,
  "icon": "https://raw.githubusercontent.com/QBitLeap/pins-umbrel/56feaea1e9aa255a9af3a4533d1b5a10fcaa0d7e/icon.svg",
  "gallery": [],
  "path": "",
