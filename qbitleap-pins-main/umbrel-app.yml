{
  "manifestVersion": 2.0,
  "id": "qbitleap-pins-main",
  "storage": {
    "dataRoot": "data"
  },
  "environment": [
    {
      "name": "INDEX_ENABLED",
      "services": [
        "indexer",
        "ui"
      ],
      "default": "0",
      "options": [
        "0",
        "1"
      ],
      "note": "Set 1 to index after checking Core, storage and power readiness."
    }
  ],
  "category": "finance",
  "name": "PINS Indexer",
