{
  "manifestVersion": 2.0,
  "id": "qbitleap-pins-main",
  "storage": {
    "dataRoot": "data"
  },
  "environment": [
    {
      "name": "INDEX_ENABLED",
      "services": [
        "indexer",
        "ui"
      ],
      "default": "1",
      "options": [
        "0",
        "1"
      ],
      "note": "Indexing starts automatically. Set 0 to pause it."
    }
  ],
  "category": "finance",
  "name": "PINS Indexer",
  "version": "0.1.4",
  "tagline": "Independent read-only PINS indexing",
  "description": "Follow your selected Qbit Core instance and maintain a separate, persistent PINS index. Indexing starts automatically when Core is available. Includes a browser status page and authenticated read API. Use the terminal for the PINS inscriber. This is an amd64 package candidate.",
  "releaseNotes": "Indexing starts automatically. Run the PINS inscriber from the Umbrel terminal.",
  "developer": "QBitLeap",
  "website": "https://github.com/P2MR-PINS-Protocol/pins",
  "dependencies": [
    "qbitleap-core-main"
  ],
  "repo": "https://github.com/QBitLeap/pins-umbrel",
  "support": "https://github.com/QBitLeap/pins-umbrel/issues",
  "port": 5102,
  "icon": "https://raw.githubusercontent.com/QBitLeap/pins-umbrel/ff7bf5c4974381575f98015dd97bf341c5029513/icon.svg",
  "gallery": [],
  "path": "",
  "defaultUsername": "",
  "defaultPassword": "",
  "submitter": "QBitLeap"
}
