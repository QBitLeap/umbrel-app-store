{
  "manifestVersion": 2.0,
  "id": "qbitleap-leap-main",
  "storage": {
    "dataRoot": "data"
  },
  "environment": [
    {
      "name": "INDEX_ENABLED",
      "services": [
        "indexer",
        "ui"
      ],
      "default": "1",
      "options": [
        "0",
        "1"
      ],
      "note": "Indexing starts automatically. Set 0 to pause it."
    }
  ],
  "category": "finance",
  "name": "LEAP Indexer",
  "version": "0.1.7",
  "tagline": "Independent read-only LEAP indexing",
  "description": "Follow your selected Qbit Core instance and maintain a separate, persistent LEAP index. Indexing starts automatically when Core is available. Includes a browser status page, authenticated read API and a terminal launcher for wallet-backed inscriptions. This is an amd64 package candidate.",
  "releaseNotes": "Raises the LEAP envelope limit to 198,000 bytes.",
  "developer": "QBitLeap",
  "website": "https://github.com/QBitLeap/LEAP",
  "dependencies": [
    "qbitleap-core-main"
  ],
  "repo": "https://github.com/QBitLeap/LEAP",
  "support": "https://github.com/QBitLeap/LEAP/issues",
  "port": 5101,
  "icon": "https://raw.githubusercontent.com/QBitLeap/LEAP/7dddcb557b63e312de110f392e26788df71467d9/umbrel/icon.svg",
  "gallery": [],
  "path": "",
  "defaultUsername": "",
  "defaultPassword": "",
  "submitter": "QBitLeap"
}
