{
  "services": {
    "app_proxy": {
      "environment": {
        "APP_HOST": "qbitleap-core-main_ui_1",
        "APP_PORT": 8080
      }
    },
    "core": {
      "user": "1000:1000",
      "restart": "on-failure",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 128,
      "init": true,
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"
      ],
      "image": "ghcr.io/qbitleap/qbit-core@sha256:af9aca0fe1805090eb6b503505b659af434798d852a6b8efe6341bf1d5d65761",
      "command": [
        "serve"
      ],
      "environment": {
        "QBIT_CHAIN": "main",
        "QBIT_NETWORK_ACTIVE": "${QBIT_NETWORK_ACTIVE:-1}",
        "QBIT_WALLET_ENABLED": "${QBIT_WALLET_ENABLED:-1}"
      },
      "volumes": [
        "${APP_DATA_DIR}/data/core:/data",
        "${APP_DATA_DIR}/data/auth:/auth",
        "control:/settings"
      ],
      "stop_grace_period": "2m",
      "mem_limit": "1536m",
      "cpus": 2,
      "healthcheck": {
        "test": [
          "CMD",
          "/opt/qbit/bin/qbit-cli",
          "-chain=main",
          "-datadir=/data",
          "-rpcport=18443",
          "-rpccookiefile=/auth/.cookie",
          "getblockchaininfo"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "30s"
      }
    },
    "broker": {
      "user": "1000:1000",
      "restart": "on-failure",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 128,
      "init": true,
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"
      ],
      "image": "ghcr.io/qbitleap/qbit-core-services@sha256:b222a85169b539113252dc97259371e70817a41e3cec589262997b596519b455",
      "command": [
        "broker"
      ],
      "network_mode": "service:core",
      "mem_limit": "1024m",
      "cpus": 2,
      "environment": {
        "QBIT_CHAIN": "main",
        "QBIT_READ_TOKEN": "${APP_QBITLEAP_CORE_MAIN_READ_TOKEN}",
        "QBIT_UI_TOKEN": "${APP_QBITLEAP_CORE_MAIN_UI_TOKEN}",
        "QBIT_CONTROL_TOKEN": "${APP_QBITLEAP_CORE_MAIN_CONTROL_TOKEN}",
        "QBIT_NETWORK_ACTIVE": "${QBIT_NETWORK_ACTIVE:-1}"
      },
      "volumes": [
        "${APP_DATA_DIR}/data/auth:/auth:ro",
        "control:/settings"
      ],
      "depends_on": {
        "core": {
          "condition": "service_healthy",
          "restart": true
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/healthz',timeout=2).close()"
        ],
        "interval": "15s",
        "timeout": "4s",
        "retries": 4
      }
    },
    "ui": {
      "user": "1000:1000",
      "restart": "on-failure",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 128,
      "init": true,
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"
      ],
      "image": "ghcr.io/qbitleap/qbit-core-services@sha256:8f6f91e8fbcdc59b67fb7cffd5bc7c105e2b9ea40957444838a6f7a32cac90b8",
      "command": [
        "ui"
      ],
      "mem_limit": "128m",
      "cpus": 0.5,
      "environment": {
        "QBIT_CHAIN": "main",
        "QBIT_READ_URL": "${APP_QBITLEAP_CORE_MAIN_READ_URL}",
        "QBIT_UI_TOKEN": "${APP_QBITLEAP_CORE_MAIN_UI_TOKEN}",
        "QBIT_CONTROL_TOKEN": "${APP_QBITLEAP_CORE_MAIN_CONTROL_TOKEN}"
      },
      "depends_on": {
        "broker": {
          "condition": "service_healthy",
          "restart": true
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz',timeout=2).close()"
        ],
        "interval": "15s",
        "timeout": "4s",
        "retries": 4
      }
    }
  },
  "volumes": {
    "control": {}
  }
}
