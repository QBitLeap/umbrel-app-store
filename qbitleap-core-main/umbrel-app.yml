{
  "manifestVersion": 2.0,
  "id": "qbitleap-core-main",
  "storage": {
    "dataRoot": "data"
  },
  "environment": [
    {
      "name": "QBIT_NETWORK_ACTIVE",
      "services": [
        "core",
        "broker"
      ],
      "default": "1",
      "options": [
        "0",
        "1"
      ],
      "note": "1 starts peer synchronization. The dashboard switch saves a choice across restarts; changing this setting resets that choice."
    }
  ],
  "category": "finance",
  "name": "Qbit Core",
  "version": "0.1.0-alpha.2",
  "tagline": "Your own Qbit node and authenticated indexer reads",
  "description": "Run an independent Qbit Core node with a browser status page. Peer synchronization starts automatically. Pause or resume it with the dashboard switch. Wallets are disabled. Compatible indexers use authenticated read RPC; Core cookies stay private. Each instance keeps its own network-specific data. This is an amd64 package candidate.",
  "releaseNotes": "Configurable minute refresh, explicit sync progress, saved networking switch and automatic peer synchronization for new nodes.",
  "developer": "QBitLeap",
  "website": "https://github.com/Qbit-Org/qbit",
  "dependencies": [],
  "repo": "https://github.com/QBitLeap/qbit-core-umbrel",
  "support": "https://github.com/QBitLeap/qbit-core-umbrel/issues",
  "port": 5100,
  "icon": "https://raw.githubusercontent.com/QBitLeap/qbit-core-umbrel/289cf1e53a890874835e46c7469b28d30c8b80ab/icon.svg",
  "gallery": [],
  "path": "",
  "defaultUsername": "operator",
  "deterministicPassword": true,
  "submitter": "QBitLeap"
}
