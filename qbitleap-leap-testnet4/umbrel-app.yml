{
  "manifestVersion": 2.0,
  "id": "qbitleap-leap-testnet4",
  "storage": {
    "dataRoot": "data"
  },
  "environment": [
    {
      "name": "INDEX_ENABLED",
      "services": [
        "indexer",
        "ui"
      ],
      "default": "0",
      "options": [
        "0",
        "1"
      ],
      "note": "Set 1 to index after checking Core, storage and power readiness."
    }
  ],
  "category": "finance",
  "name": "LEAP Indexer \u00b7 Testnet4",
  "version": "0.1.1",
  "tagline": "Independent read-only LEAP indexing",
  "description": "Follow your selected Qbit Core instance and maintain a separate, persistent LEAP index. Indexing starts paused; enable INDEX_ENABLED in app settings when ready. Includes a browser status page and authenticated read API. No wallets, signing or broadcasting. This is an amd64 package candidate.",
  "releaseNotes": "Configurable dashboard refresh in minutes, one-minute minimum, and clearer paused/index-height status.",
  "developer": "QBitLeap",
  "website": "https://github.com/QBitLeap/LEAP",
  "dependencies": [
    "qbitleap-core-testnet4"
  ],
  "repo": "https://github.com/QBitLeap/leap-umbrel",
  "support": "https://github.com/QBitLeap/leap-umbrel/issues",
  "port": 5111,
  "icon": "https://raw.githubusercontent.com/QBitLeap/leap-umbrel/fdc97907c319ce49f58f9afa5ca4beb85f5bd62c/icon.svg",
  "gallery": [],
  "path": "",
  "defaultUsername": "",
  "defaultPassword": "",
  "submitter": "QBitLeap"
}
