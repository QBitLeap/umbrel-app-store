{
  "manifestVersion": 2.0,
  "id": "qbitleap-leap-testnet4",
  "storage": {
    "dataRoot": "data"
  },
  "environment": [
    {
      "name": "INDEX_ENABLED",
      "services": [
        "indexer",
        "ui"
      ],
      "default": "1",
      "options": [
        "0",
        "1"
      ],
      "note": "Indexing starts automatically. Set 0 to pause it."
    }
  ],
  "category": "finance",
  "name": "LEAP Indexer \u00b7 Testnet4",
  "version": "0.1.5",
  "tagline": "Independent read-only LEAP indexing",
  "description": "Follow your selected Qbit Core instance and maintain a separate, persistent LEAP index. Indexing starts automatically when Core is available. Includes a browser status page, authenticated read API and a terminal launcher for wallet-backed inscriptions. This is an amd64 package candidate.",
  "releaseNotes": "Indexing starts automatically. Run the LEAP CLI from the Umbrel terminal to inscribe with a local Core wallet.",
  "developer": "QBitLeap",
  "website": "https://github.com/QBitLeap/LEAP",
  "dependencies": [
    "qbitleap-core-testnet4"
  ],
  "repo": "https://github.com/QBitLeap/leap-umbrel",
  "support": "https://github.com/QBitLeap/leap-umbrel/issues",
  "port": 5111,
  "icon": "https://raw.githubusercontent.com/QBitLeap/umbrel-app-store/main/qbitleap-leap-testnet4/icon.svg?v=0.1.5",
  "gallery": [],
  "path": "",
  "defaultUsername": "",
  "defaultPassword": "",
  "submitter": "QBitLeap"
}
