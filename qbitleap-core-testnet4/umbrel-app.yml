{
  "manifestVersion": 2.0,
  "id": "qbitleap-core-testnet4",
  "storage": {
    "dataRoot": "data"
  },
  "environment": [
    {
      "name": "QBIT_NETWORK_ACTIVE",
      "services": [
        "core",
        "broker"
      ],
      "default": "1",
      "options": [
        "0",
        "1"
      ],
      "note": "1 starts peer synchronization. The dashboard switch saves a choice across restarts; changing this setting resets that choice."
    },
    {
      "name": "QBIT_WALLET_ENABLED",
      "services": [
        "core"
      ],
      "default": "1",
      "options": [
        "0",
        "1"
      ],
      "note": "Local wallets are enabled for LEAP and qord terminal commands. Set 0 to disable them."
    }
  ],
  "category": "finance",
  "name": "Qbit Core \u00b7 Testnet4",
  "version": "0.1.6",
  "tagline": "Your own Qbit node and authenticated indexer reads",
  "description": "Run an independent Qbit Core node with a browser status page. Peer synchronization starts automatically. Pause or resume it with the dashboard switch. Local Core wallets are enabled by default. Compatible indexers use authenticated read RPC. Each instance keeps its own network-specific data. This is an amd64 package candidate.",
  "releaseNotes": "Local wallets start automatically for LEAP and qord terminal commands.",
  "developer": "QBitLeap",
  "website": "https://github.com/Qbit-Org/qbit",
  "dependencies": [],
  "repo": "https://github.com/QBitLeap/qbit-core-umbrel",
  "support": "https://github.com/QBitLeap/qbit-core-umbrel/issues",
  "port": 5110,
  "icon": "https://raw.githubusercontent.com/QBitLeap/umbrel-app-store/main/qbitleap-core-testnet4/icon.svg?v=0.1.6",
  "gallery": [],
  "path": "",
  "submitter": "QBitLeap"
}
